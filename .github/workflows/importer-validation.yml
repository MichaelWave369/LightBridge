name: Recovery importer validation

on:
  push:
  pull_request:

jobs:
  importer-self-test:
    name: Importer self-tests (not optical runtime)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated copy-only importer tests
        run: python -m unittest discover -s tests -p 'test_import_recovered.py' -v
